<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

         screens and pinch-zooming a bill is a legitimate thing to want. -->

    <meta name="theme-color" content="#a31621" />
    <!-- Added to the home screen on a till tablet, this is what it is called. -->
    <meta name="apple-mobile-web-app-title" content="NLFR POS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Point of sale for Next Level Family Restaurant." />
    <title>Next Level POS</title>
  </head>
  <body>
