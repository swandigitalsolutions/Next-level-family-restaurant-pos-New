<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-598406d1-4b4d-40c4-a649-fbae09130236/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Archivo:wght@500;600;700&display=swap">
<style>
  body { margin:0; background:#14100d; font-family:Archivo,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#f6c445; } a:hover { color:#ffd76b; }
  button:focus-visible { outline:3px solid #f6c445; outline-offset:3px; }
  @keyframes edgeFlash { 0%,100%{ box-shadow: inset 0 0 0 0 rgba(246,196,69,0); } 50%{ box-shadow: inset 0 0 0 14px rgba(246,196,69,.85); } }
  @keyframes ticketIn { from { opacity:0; transform:translateX(-26px) scale(.97); } to { opacity:1; transform:none; } }
  @keyframes latePulse { 0%,100%{ border-color:#a31621; } 50%{ border-color:#ff5a68; } }
  @keyframes confirmPop { 0%{ transform:scale(1); } 40%{ transform:scale(1.04); } 100%{ transform:scale(1); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
</style>
</helmet>

<div style="min-height:100vh;background:#14100d;color:#f3e7d4;display:flex;flex-direction:column;animation:{{ screenFlash }}">

  <div style="display:flex;align-items:center;gap:20px;padding:16px 22px;background:#0d0a08;border-bottom:3px solid #3a2f26">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-family:Bitter,serif;font-size:26px;font-weight:700;color:#fbf3e7;letter-spacing:-.01em">KITCHEN</span>
      <span style="font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#8a7967;font-weight:600">Oldest first</span>
    </div>

    <div style="display:flex;gap:12px;flex:1">
      <sc-for list="{{ counts }}" as="c" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:11px;background:#1d1713;border:2px solid {{ c.color }};border-radius:12px;padding:10px 18px">
          <span style="font-family:Bitter,serif;font-size:34px;font-weight:700;line-height:1;color:{{ c.color }};font-variant-numeric:tabular-nums">{{ c.n }}</span>
          <span style="font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#c9b69a">{{ c.label }}</span>
        </div>
      </sc-for>
    </div>

    <span style="font-family:Bitter,serif;font-size:34px;font-weight:700;color:#fbf3e7;font-variant-numeric:tabular-nums">{{ clock }}</span>

    <button type="button" onClick="{{ toggleSound }}" style="min-width:132px;min-height:76px;border-radius:14px;border:3px solid {{ soundBorder }};background:{{ soundBg }};color:{{ soundFg }};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Archivo,sans-serif">
      {{ soundIcon }}
      <span style="font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">{{ soundLabel }}</span>
    </button>
  </div>

  <sc-if value="{{ soundOff }}" hint-placeholder-val="{{ false }}">
    <div style="background:#e3a522;color:#14100d;padding:12px 22px;display:flex;align-items:center;gap:12px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14100d" stroke-width="2.4" stroke-linecap="round" style="flex:none"><path d="M3 3l18 18M11 5L6 9H3v6h3l5 4V5z"></path></svg>
      <span style="font-size:19px;font-weight:700">Sound is OFF — new tickets will arrive silently. Watch the screen.</span>
    </div>
  </sc-if>

  <div style="flex:1;padding:18px 22px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-content:start">
    <sc-for list="{{ tickets }}" as="t" hint-placeholder-count="4">
      <button type="button" onClick="{{ t.advance }}" style="text-align:left;border:4px solid {{ t.edge }};border-radius:16px;background:#1d1713;cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:280px;animation:{{ t.anim }};font-family:Archivo,sans-serif">
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:{{ t.edge }};color:#14100d">
          <span style="font-family:Bitter,serif;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums">{{ t.num }}</span>
          <span style="flex:1;font-size:19px;font-weight:700;letter-spacing:.02em">{{ t.where }}</span>
          <span style="font-family:Bitter,serif;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums">{{ t.age }}</span>
        </div>
        <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ t.items }}" as="i" hint-placeholder-count="3">
            <div style="display:flex;align-items:baseline;gap:14px">
              <span style="font-family:Bitter,serif;font-size:34px;font-weight:700;color:#f6c445;min-width:56px;font-variant-numeric:tabular-nums">{{ i.qty }}×</span>
              <span style="flex:1;font-size:30px;font-weight:600;line-height:1.15;color:#fbf3e7">{{ i.name }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ t.note }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:auto;border-left:5px solid #f6c445;padding:8px 12px;background:#2a2119;border-radius:6px;font-size:21px;color:#f3e7d4;line-height:1.3">{{ t.note }}</div>
          </sc-if>
        </div>
        <div style="padding:12px 16px 14px;border-top:2px solid #3a2f26;display:flex;align-items:center;gap:12px;background:#171310">
          <span style="font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a7967">{{ t.status }}</span>
          <span style="flex:1"></span>
          <span style="font-size:19px;font-weight:700;color:{{ t.edge }}">Tap → {{ t.next }}</span>
        </div>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{ quiet }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:60px 24px;animation:fadeUp .4s ease">
      <svg width="260" height="80" viewBox="0 0 120 34" fill="none" stroke="#3a2f26" stroke-width="1.3" stroke-linecap="round">
        <line x1="4" y1="31" x2="116" y2="31"></line>
        <g><circle cx="28" cy="9" r="4"></circle><path d="M28 13 L21 25 M28 13 L35 25 M21 16 L35 16"></path></g>
        <g><path d="M60 13 L67 25 L53 25 Z M67 5 L60 13 L53 5"></path></g>
        <g><circle cx="92" cy="9" r="4"></circle><path d="M92 13 L85 25 M92 13 L99 25 M85 16 L99 16"></path></g>
      </svg>
      <div style="font-family:Bitter,serif;font-size:40px;font-weight:700;color:#5a4c3f">All clear</div>
      <div style="font-size:22px;color:#5a4c3f;text-align:center;max-width:520px;line-height:1.4">No tickets in the pass. The board wakes up on its own when billing accepts the next order.</div>
    </div>
  </sc-if>

  <sc-if value="{{ undoOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:50;display:flex;align-items:center;gap:18px;background:#fbf3e7;color:#14100d;border-radius:14px;padding:14px 16px 14px 20px;box-shadow:0 18px 50px -14px rgba(0,0,0,.8);animation:fadeUp .2s ease">
      <span style="font-size:20px;font-weight:700">{{ undoText }}</span>
      <button type="button" onClick="{{ undo }}" style="min-height:56px;padding:0 22px;border-radius:10px;border:0;background:#a31621;color:#fbf3e7;font-size:19px;font-weight:700;cursor:pointer;font-family:Archivo,sans-serif">Undo</button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
const FLOW = ['QUEUED', 'PREPARING', 'READY', 'DONE'];

class Component extends DCLogic {
  state = {
    now: Date.now(), sound: true, undo: null, flash: false, seq: 0,
    tickets: [
      { id:1, num:'K-214', where:'Table 6', t:-1080, status:'QUEUED', note:'Less spicy — child', items:[[2,'Butter Chicken'],[4,'Tandoori Roti'],[1,'Jeera Rice']] },
      { id:2, num:'K-215', where:'WEBSITE PICKUP', t:-640, status:'PREPARING', note:'', items:[[1,'Chicken Dum Biryani'],[1,'Tandoori Chicken ½']] },
      { id:3, num:'K-216', where:'Table 9', t:-410, status:'QUEUED', note:'No onion', items:[[2,'Paneer Butter Masala'],[4,'Butter Naan']] },
      { id:4, num:'K-217', where:'Table 2', t:-120, status:'QUEUED', note:'', items:[[1,'Chicken Lollipop'],[2,'Masala Chai']] }
    ]
  };

  componentDidMount() {
    this.t = setInterval(() => this.setState({ now: Date.now() }), 1000);
    this.a = setTimeout(() => this.arrive(), 12000);
  }
  componentWillUnmount() { clearInterval(this.t); clearTimeout(this.a); clearTimeout(this.f); clearTimeout(this.u); }

  arrive = () => {
    this.setState(s => ({
      seq: s.seq + 1, flash: true,
      tickets: [...s.tickets, { id:300 + s.seq, num:'K-2' + (18 + s.seq), where:'Table 4', t:0, status:'QUEUED', note:'Extra raita', items:[[2,'Veg Biryani'],[1,'Gulab Jamun (2)']], fresh:true }]
    }));
    this.f = setTimeout(() => this.setState({ flash:false }), 3000);
  };

  advance = id => {
    const t = this.state.tickets.find(x => x.id === id);
    const next = FLOW[Math.min(FLOW.length - 1, FLOW.indexOf(t.status) + 1)];
    this.setState(s => ({
      tickets: next === 'DONE' ? s.tickets.filter(x => x.id !== id) : s.tickets.map(x => x.id === id ? { ...x, status: next, fresh:false } : x),
      undo: { id, prev: t.status, ticket: t, num: t.num, to: next }
    }));
    clearTimeout(this.u);
    this.u = setTimeout(() => this.setState({ undo:null }), 6000);
  };

  renderVals() {
    const e = React.createElement, s = this.state;
    const base = Math.floor(s.now / 1000);
    if (!this.t0) this.t0 = base;

    const withAge = s.tickets.map(t => ({ ...t, sec: Math.max(0, base - this.t0 - t.t) }))
      .sort((a, b) => b.sec - a.sec);

    const edgeFor = sec => sec > 900 ? '#a31621' : (sec > 480 ? '#e3a522' : '#4b6b3d');
    const fmt = sec => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');

    const tickets = withAge.map(t => ({
      num: t.num, where: t.where, age: fmt(t.sec), status: t.status,
      next: FLOW[Math.min(FLOW.length - 1, FLOW.indexOf(t.status) + 1)],
      edge: edgeFor(t.sec), note: t.note,
      items: t.items.map(([qty, name]) => ({ qty, name })),
      anim: t.fresh ? 'ticketIn .4s ease' : (t.sec > 900 ? 'latePulse 1.2s ease-in-out infinite' : 'none'),
      advance: () => this.advance(t.id)
    }));

    const countOf = k => withAge.filter(t => t.status === k).length;
    const counts = [
      { label:'Queued', n: countOf('QUEUED'), color:'#4b6b3d' },
      { label:'Preparing', n: countOf('PREPARING'), color:'#ff9933' },
      { label:'Ready', n: countOf('READY'), color:'#f6c445' },
      { label:'Late', n: withAge.filter(t => t.sec > 900).length, color:'#a31621' }
    ];

    const now = new Date(s.now);
    const clock = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });

    const soundIcon = s.sound
      ? e('svg', { width:34, height:34, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2.2, strokeLinecap:'round' }, e('path', { d:'M11 5L6 9H3v6h3l5 4V5zM16 9a4 4 0 010 6M19 6a8 8 0 010 12' }))
      : e('svg', { width:34, height:34, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2.2, strokeLinecap:'round' }, e('path', { d:'M3 3l18 18M11 5L6 9H3v6h3l5 4V5z' }));

    return {
      tickets, counts, clock, quiet: tickets.length === 0,
      screenFlash: s.flash && s.sound ? 'edgeFlash .7s ease-in-out 3' : (s.flash ? 'edgeFlash .7s ease-in-out 5' : 'none'),
      soundOff: !s.sound, toggleSound: () => this.setState({ sound: !s.sound }),
      soundBg: s.sound ? '#4b6b3d' : '#e3a522', soundFg: s.sound ? '#fbf3e7' : '#14100d',
      soundBorder: s.sound ? '#6f9a5c' : '#f6c445',
      soundLabel: s.sound ? 'Sound on' : 'Sound off', soundIcon,
      undoOpen: !!s.undo,
      undoText: s.undo ? s.undo.num + ' → ' + s.undo.to.charAt(0) + s.undo.to.slice(1).toLowerCase() : '',
      undo: () => this.setState(st => ({
        tickets: st.tickets.find(x => x.id === st.undo.id)
          ? st.tickets.map(x => x.id === st.undo.id ? { ...x, status: st.undo.prev } : x)
          : [...st.tickets, { ...st.undo.ticket, status: st.undo.prev }],
        undo: null
      }))
    };
  }
}
</script>
</body>
</html>
